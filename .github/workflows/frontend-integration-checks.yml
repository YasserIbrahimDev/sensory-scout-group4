name: Frontend Integration Checks

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-integration-checks.yml'
  push:
    branches:
      - hamza/sprint2-backend-search-filters

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Unit tests
        run: npm test -- --run
